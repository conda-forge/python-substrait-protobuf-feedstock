schema_version: 1

context:
  version: "0.101.0"

package:
  name: python-substrait-protobuf
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/substrait-protobuf/substrait_protobuf-${{ version }}.tar.gz
  sha256: d15be9f5d2b70d92f25b2a420f05733577e6d8a75c419f544bf8d922e249dc39

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80
    - pip
  run:
    - python >=${{ python_min }}
    - protobuf >=5,<7

tests:
  - python:
      imports:
        - substrait.plan_pb2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Generated Substrait Protocol Buffer Code
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://substrait.io
  repository: https://github.com/substrait-io/substrait-packaging

extra:
  mappings:
    python:
      pypi: substrait-protobuf
      import_name: substrait.plan_pb2
  recipe-maintainers:
    - westonpace
    - epsilonprime
    - jacques-n
    - yongchul
    - benbellick
    - vbarua
    - nielspardon
